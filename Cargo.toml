[workspace]
resolver = "2"

members = [
    "contracts/stream",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[workspace.dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }
